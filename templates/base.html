<!DOCTYPE html>
<html lang="en" >
<head>
    <meta name='viewport' content='width=device-width, initial-scale=1, shrink-to-fit=no'>
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>{% block title %}Головна{% endblock title %}</title>

</head>
 <style>
                .ts-wrapper.ts-dropup .ts-dropdown {
                top: auto;
                bottom: 100%;
                margin: 0 0 2px 0;
                }
                html {
    overflow-y: scroll;
}
            </style>

<body class="d-flex flex-column vh-100">
        {% block content %}
        {% endblock content %}

<script>
document.addEventListener('DOMContentLoaded', () => {
    const searchUrl = "{% url 'free_address_search' %}";
    new TomSelect('#id_addresses', {
        plugins: ['remove_button'],
        valueField: 'id',
        labelField: 'text',
        searchField: ['text'],
        maxOptions: 30,
        loadThrottle: 300,
        closeAfterSelect: false,
        placeholder: 'Введіть вулицю або регіон…',
        preload: 'focus',
        shouldLoad: q => q.length === 0 || q.length >= 2,
        onInitialize() { this.wrapper.classList.add('ts-dropup'); },
        load(query, callback) {
            fetch(`${searchUrl}?q=${encodeURIComponent(query)}&client={{ object.pk|default:'' }}`)
                .then(r => r.json())
                .then(data => callback(data.results))
                .catch(err => { console.error('Помилка пошуку адрес:', err); callback(); });
        },
        render: {
            no_results: () => '<div class="no-results">Нічого не знайдено</div>',
        },
    });
});

</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
    document.querySelectorAll('[data-bs-toggle="popover"]').forEach(el => new bootstrap.Popover(el));
});
</script>
</body>
</html>
